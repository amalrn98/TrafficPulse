apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafficpulse-dashboard
  namespace: trafficpulse
  labels:
    app: trafficpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trafficpulse
  template:
    metadata:
      labels:
        app: trafficpulse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/metrics"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: trafficpulse
          image: ghcr.io/amalrn98/trafficpulse:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: trafficpulse-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trafficpulse-service
  namespace: trafficpulse
spec:
  selector:
    app: trafficpulse
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trafficpulse-hpa
  namespace: trafficpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trafficpulse-dashboard
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trafficpulse-pdb
  namespace: trafficpulse
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: trafficpulse
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trafficpulse-network-policy
  namespace: trafficpulse
spec:
  podSelector:
    matchLabels:
      app: trafficpulse
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
