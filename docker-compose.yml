version: '3.8'

services:
  trafficpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trafficpulse
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - trafficpulse_data:/app/apps/dashboard/prisma
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  trafficpulse_data:
