services:
  trafficpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trafficpulse
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./apps/dashboard/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://trafficpulse:secretpassword@postgres:5432/trafficpulse?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: trafficpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trafficpulse
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: trafficpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trafficpulse -d trafficpulse']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: trafficpulse-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
