services:
  # One-shot job: creates/updates tables before the app starts.
  # Uses the builder stage because it contains the Prisma CLI (the runtime image does not).
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ['npx', 'prisma', 'db', 'push', '--schema=apps/dashboard/prisma/schema.postgres.prisma', '--skip-generate']
    environment:
      - DATABASE_URL=postgresql://trafficpulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/trafficpulse?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  trafficpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trafficpulse
    restart: unless-stopped
    ports:
      # Loopback only. Put a TLS reverse proxy in front and set TRUST_PROXY=true there.
      - '127.0.0.1:3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://trafficpulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/trafficpulse?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: trafficpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trafficpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trafficpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trafficpulse -d trafficpulse']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: trafficpulse-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
