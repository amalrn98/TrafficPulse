services:
  trafficpulse-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trafficpulse-dev
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=file:./dev.db
    volumes:
      - ./apps/dashboard/prisma:/app/apps/dashboard/prisma

