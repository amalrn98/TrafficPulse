name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup Prisma Database Client
        run: |
          npm run db:generate --workspace=@trafficpulse/dashboard
          npm run db:push --workspace=@trafficpulse/dashboard

      - name: Build All Workspaces
        run: npm run build

      - name: Run Monorepo Test Suite
        run: npm test

      - name: Build Production Dashboard
        run: npm run build --workspace=@trafficpulse/dashboard
