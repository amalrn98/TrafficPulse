name: CI

on:
  push:
    branches: [main, hardening/*]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trafficpulse
          POSTGRES_PASSWORD: trafficpulse_password
          POSTGRES_DB: trafficpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Lint Workspaces
        run: npm run lint

      - name: Setup Prisma Database Client
        run: |
          npm run db:generate --workspace=@trafficpulse/dashboard
          npm run db:push --workspace=@trafficpulse/dashboard

      - name: Build All Workspaces
        run: npm run build

      - name: Run Test Suite
        run: npm test

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config -q
